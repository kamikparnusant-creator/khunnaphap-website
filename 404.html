<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="robots" content="noindex" />
    <title>ไม่พบหน้านี้ | ตรอ.คุณภาพ</title>
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-192.jpg" sizes="192x192" type="image/jpeg" />
    <link rel="apple-touch-icon" href="/favicon-192.jpg" />
    <style>
      :root{--ink:#2d213e;--muted:#5d5168;--purple:#7645b5;--paper:#fcfafc}
      @media (prefers-color-scheme:dark){:root{--ink:#ece6f3;--muted:#c4b9d0;--purple:#b48cf0;--paper:#141019}}
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai',Thonburi,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
      h1{font-size:28px;margin:0 0 8px}p{color:var(--muted);margin:0 0 28px}
      a{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--purple);color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main>
      <h1>ไม่พบหน้าที่คุณค้นหา</h1>
      <p>ลิงก์อาจไม่ถูกต้อง หรือหน้านี้ถูกย้ายไปแล้ว</p>
      <a href="/">กลับหน้าแรก ตรอ.คุณภาพ</a>
    </main>
  </body>
</html>
